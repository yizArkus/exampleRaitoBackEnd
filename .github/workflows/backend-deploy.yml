# CI: lint, typecheck, tests + cobertura
# CD (solo develop): OIDC → Secrets Manager → buildx (GHA cache) → ECR → nueva task definition → ECS
#
# Configuración (una de estas opciones por clave):
#   Settings → Actions → Variables (repositorio), O
#   Settings → Environments → development → Environment variables, O
#   Settings → Actions → Secrets (mismos nombres; valores enmascarados en logs)
#
#   AWS_ROLE_TO_ASSUME             ARN del rol IAM para GitHub OIDC
#   AWS_SECRETS_MANAGER_SECRET_ID  Nombre o ARN del secreto en AWS Secrets Manager (JSON abajo)
#   AWS_REGION_DEFAULT             (opcional) Región del get-secret-value inicial, ej. us-east-1
#
# El JSON en Secrets Manager debe incluir (sin hardcodear en el workflow):
#   AWS_REGION, AWS_ACCOUNT_ID, ECR_REPOSITORY_NAME, ECS_CLUSTER, ECS_SERVICE, ECS_CONTAINER_NAME
# Opcional: ECS_CONTAINER_PORT (default 8080) — debe coincidir con el puerto del target group del ALB
# Migraciones BD: no se ejecutan desde el runner de GitHub (RDS privado en VPC). Tras registrar la nueva
#   revision de task definition, el pipeline lanza **ECS Run Task** (one-off) con la misma imagen y
#   `command` override → `node dist/scripts/run-migrations.js` (misma red que el servicio).
#   IAM del rol OIDC: adjunta una política con ecs:RunTask, ecs:DescribeTasks, ecs:DescribeTaskDefinition
#   e iam:PassRole a los roles execution/task de la task definition (ejemplo: infra/ecs-run-task-migrate-iam-policy.json).
#   Si ves AccessDeniedException en RunTask, falta ecs:RunTask o PassRole al rol de la task.
# En la task definition (Secrets Manager / env): DB_* o POSTGRES_* y opcional BOOTSTRAP_ADMIN_PASSWORD
#   para el usuario inicial (ver src/scripts/run-migrations.ts).
# Importante: este job NO usa environment: GitHub. Las variables del Environment "development" NO aplican
#   salvo que añadas "environment: development" al job y actualices la trust policy OIDC en IAM si hace falta.

name: Backend CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      branch:
        description: "Rama a desplegar (solo develop)"
        required: true
        default: "develop"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  DOCKERFILE_PATH: ./Dockerfile
  AWS_REGION_DEFAULT: ${{ vars.AWS_REGION_DEFAULT || 'us-east-1' }}

jobs:
  ci:
    name: CI (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm ci

      - name: Lint
        run: |
          set -euo pipefail
          npm run lint

      - name: Type check
        run: |
          set -euo pipefail
          npx tsc --noEmit

      - name: Tests with coverage
        run: |
          set -euo pipefail
          npm run test:coverage

      - name: Enforce coverage threshold (60%)
        run: |
          set -euo pipefail
          if [[ ! -f coverage/coverage-summary.json ]]; then
            echo "::error::coverage/coverage-summary.json not found"
            exit 1
          fi
          COVERAGE=$(jq -r '.total.lines.pct' coverage/coverage-summary.json)
          echo "Lines coverage: ${COVERAGE}%"
          if awk "BEGIN { exit !(${COVERAGE} < 60) }"; then
            echo "::error::Coverage ${COVERAGE}% is below 60% threshold"
            exit 1
          fi

  deploy-develop:
    name: CD Develop (OIDC → ECR → ECS)
    needs: ci
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.branch == 'develop')
    runs-on: ubuntu-latest
    # Sin "environment" aquí, el JWT OIDC usa sub tipo repo:ORG/REPO:ref:refs/heads/develop.
    # Si necesitas el entorno GitHub (aprobaciones, secrets de entorno), vuelve a poner:
    #   environment: development
    # y en la trust policy del rol añade también:
    #   repo:ORG/REPO:environment:development
    defaults:
      run:
        shell: bash

    permissions:
      contents: read
      id-token: write

    env:
      # Prioridad: Repository/Environment Secrets, luego Variables (mismo nombre).
      # Nota: muchos equipos guardan el ARN y el id del secreto en "Repository secrets"; si vars va primero en el ||, a veces el env queda vacío en el runner.
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME || vars.AWS_ROLE_TO_ASSUME }}
      SECRET_NAME: ${{ secrets.AWS_SECRETS_MANAGER_SECRET_ID || vars.AWS_SECRETS_MANAGER_SECRET_ID }}

    steps:
      - name: Validate AWS role and Secrets Manager id
        run: |
          set -euo pipefail
          missing=()
          [[ -z "${AWS_ROLE_TO_ASSUME:-}" ]] && missing+=("AWS_ROLE_TO_ASSUME")
          [[ -z "${SECRET_NAME:-}" ]] && missing+=("AWS_SECRETS_MANAGER_SECRET_ID")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Faltan valores para: ${missing[*]}"
            echo "Define Repository secrets o Variables con esos nombres (o el entorno development)."
            echo "Si usas solo Secrets: Settings → Actions → Secrets (como en tu captura)."
            exit 1
          fi

      - name: Validate manual dispatch branch
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          if [[ "${{ github.event.inputs.branch }}" != "develop" ]]; then
            echo "::error::Solo se permite desplegar manualmente la rama develop"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref }}

      - name: Install jq
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends jq

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract short SHA and sanitized branch name
        id: vars
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            REF_NAME="${{ github.event.inputs.branch }}"
          else
            REF_NAME="${GITHUB_REF_NAME}"
          fi
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "branch_name=$(echo "${REF_NAME}" | sed 's/[^a-zA-Z0-9._-]/-/g')" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION_DEFAULT }}
          audience: sts.amazonaws.com

      - name: Load deploy config from AWS Secrets Manager
        id: load-secret
        env:
          SECRET_ID: ${{ env.SECRET_NAME }}
        run: |
          set -euo pipefail

          SECRET_JSON=$(aws secretsmanager get-secret-value \
            --secret-id "${SECRET_ID}" \
            --region "${AWS_REGION_DEFAULT}" \
            --query SecretString \
            --output text)

          read_secret() {
            local key="$1"
            local val
            val=$(echo "${SECRET_JSON}" | jq -r --arg k "$key" '.[$k] // empty')
            if [[ -z "${val}" || "${val}" == "null" ]]; then
              echo "::error::Clave obligatoria ausente o nula en el secreto: ${key}"
              exit 1
            fi
            printf '%s' "${val}"
          }

          AWS_REGION=$(read_secret AWS_REGION)
          AWS_ACCOUNT_ID=$(read_secret AWS_ACCOUNT_ID)
          ECR_REPOSITORY_NAME=$(read_secret ECR_REPOSITORY_NAME)
          ECS_CLUSTER=$(read_secret ECS_CLUSTER)
          ECS_SERVICE=$(read_secret ECS_SERVICE)
          ECS_CONTAINER_NAME=$(read_secret ECS_CONTAINER_NAME)

          ECS_CONTAINER_PORT=$(echo "${SECRET_JSON}" | jq -r '.ECS_CONTAINER_PORT // "8080"')
          if [[ -z "${ECS_CONTAINER_PORT}" || "${ECS_CONTAINER_PORT}" == "null" ]]; then
            ECS_CONTAINER_PORT="8080"
          fi

          {
            echo "AWS_REGION=${AWS_REGION}"
            echo "AWS_ACCOUNT_ID=${AWS_ACCOUNT_ID}"
            echo "ECR_REPOSITORY_NAME=${ECR_REPOSITORY_NAME}"
            echo "ECS_CLUSTER=${ECS_CLUSTER}"
            echo "ECS_SERVICE=${ECS_SERVICE}"
            echo "ECS_CONTAINER_NAME=${ECS_CONTAINER_NAME}"
            echo "ECS_CONTAINER_PORT=${ECS_CONTAINER_PORT}"
          } >> "$GITHUB_ENV"

          {
            echo "ecr_repository_name=${ECR_REPOSITORY_NAME}"
            echo "ecs_cluster=${ECS_CLUSTER}"
            echo "ecs_service=${ECS_SERVICE}"
            echo "ecs_container_name=${ECS_CONTAINER_NAME}"
          } >> "$GITHUB_OUTPUT"

          echo "Config cargada desde Secrets Manager (valores no mostrados)."

      - name: Ensure ECR repository exists
        run: |
          set -euo pipefail
          if ! aws ecr describe-repositories --repository-names "${ECR_REPOSITORY_NAME}" --region "${AWS_REGION}" >/dev/null 2>&1; then
            echo "Creando repositorio ECR: ${ECR_REPOSITORY_NAME}"
            aws ecr create-repository --repository-name "${ECR_REPOSITORY_NAME}" --region "${AWS_REGION}" --no-cli-pager
          fi

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: true

      - name: Build and push image (buildx + GHA cache)
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ steps.load-secret.outputs.ecr_repository_name }}:${{ steps.vars.outputs.short_sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ steps.load-secret.outputs.ecr_repository_name }}:${{ steps.vars.outputs.branch_name }}
            ${{ steps.login-ecr.outputs.registry }}/${{ steps.load-secret.outputs.ecr_repository_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Export image URI for summary
        id: image-meta
        run: |
          set -euo pipefail
          URI="${{ steps.login-ecr.outputs.registry }}/${{ steps.load-secret.outputs.ecr_repository_name }}:${{ steps.vars.outputs.short_sha }}"
          echo "image_uri=${URI}" >> "$GITHUB_OUTPUT"

      - name: Register new ECS task definition revision
        id: register-task-def
        env:
          NEW_IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ steps.load-secret.outputs.ecr_repository_name }}:${{ steps.vars.outputs.short_sha }}
        run: |
          set -euo pipefail

          echo "Contenedor ECS: ${ECS_CONTAINER_NAME}"
          echo "Puerto contenedor (ALB/TG): ${ECS_CONTAINER_PORT}"
          echo "Imagen nueva: ${NEW_IMAGE}"

          TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}" \
            --region "${AWS_REGION}" \
            --query "services[0].taskDefinition" \
            --output text)

          if [[ -z "${TASK_DEF_ARN}" || "${TASK_DEF_ARN}" == "None" ]]; then
            echo "::error::No se pudo resolver la task definition del servicio"
            exit 1
          fi

          echo "Task definition actual: ${TASK_DEF_ARN}"

          TASK_DEF_JSON=$(aws ecs describe-task-definition \
            --task-definition "${TASK_DEF_ARN}" \
            --region "${AWS_REGION}")

          # Registro: quitar campos de solo lectura; imágenes por contenedor; opcionales nulos seguros
          NEW_TASK_DEF=$(echo "${TASK_DEF_JSON}" | jq --arg IMAGE "${NEW_IMAGE}" --arg CONTAINER "${ECS_CONTAINER_NAME}" --arg CPORT "${ECS_CONTAINER_PORT}" '
            .taskDefinition
            | del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy,
                .deregisteredAt
              )
            | .containerDefinitions |= map(
                if .name == $CONTAINER then
                  .image = $IMAGE
                  | .portMappings = [{ "containerPort": ($CPORT | tonumber), "protocol": "tcp" }]
                  | .environment = (
                      ((.environment // []) | map(select(.name != "PORT"))) + [{ "name": "PORT", "value": $CPORT }]
                    )
                else
                  .
                end
              )
            | .volumes = (.volumes // [])
            | .placementConstraints = (.placementConstraints // [])
            | {
                family: .family,
                executionRoleArn: .executionRoleArn,
                containerDefinitions: .containerDefinitions,
                requiresCompatibilities: .requiresCompatibilities,
                cpu: .cpu,
                memory: .memory,
                volumes: .volumes,
                placementConstraints: .placementConstraints
              }
              + (if (.networkMode // null) != null and (.networkMode | tostring | length) > 0
                 then { networkMode: .networkMode } else {} end)
              + (if (.taskRoleArn // null) != null and (.taskRoleArn | tostring | length) > 0
                 then { taskRoleArn: .taskRoleArn } else {} end)
              + (if (.runtimePlatform // null) != null then { runtimePlatform: .runtimePlatform } else {} end)
              + (if (.ephemeralStorage // null) != null then { ephemeralStorage: .ephemeralStorage } else {} end)
              + (if (.pidMode // null) != null then { pidMode: .pidMode } else {} end)
              + (if (.ipcMode // null) != null then { ipcMode: .ipcMode } else {} end)
              + (if (.proxyConfiguration // null) != null then { proxyConfiguration: .proxyConfiguration } else {} end)
              + (if (.inferenceAccelerators // null) != null and (.inferenceAccelerators | length) > 0
                 then { inferenceAccelerators: .inferenceAccelerators } else {} end)
          ')

          echo "${NEW_TASK_DEF}" | jq empty
          echo "${NEW_TASK_DEF}" > task-def.json

          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-def.json \
            --region "${AWS_REGION}" \
            --query "taskDefinition.taskDefinitionArn" \
            --output text \
            --no-cli-pager)

          echo "task_def_arn=${NEW_TASK_DEF_ARN}" >> "$GITHUB_OUTPUT"
          echo "Nueva task definition: ${NEW_TASK_DEF_ARN}"

      - name: Run database migrations (ECS one-off task)
        id: ecs-migrate
        env:
          NEW_TASK_DEF_ARN: ${{ steps.register-task-def.outputs.task_def_arn }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          OVERRIDES_JSON=$(jq -n \
            --arg name "${ECS_CONTAINER_NAME}" \
            '{containerOverrides:[{name:$name,command:["node","dist/scripts/run-migrations.js"]}]}')

          SERVICE_JSON=$(aws ecs describe-services \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}" \
            --region "${AWS_REGION}" \
            --output json)

          NC_JSON=$(echo "${SERVICE_JSON}" | jq -c '.services[0].networkConfiguration.awsvpcConfiguration // empty')
          if [[ -z "${NC_JSON}" || "${NC_JSON}" == "null" ]]; then
            echo "::error::El servicio no expone networkConfiguration.awsvpcConfiguration (se requiere awsvpc, p. ej. Fargate)."
            exit 1
          fi

          SUBNETS=$(echo "${NC_JSON}" | jq -r '.subnets | join(",")')
          SGS=$(echo "${NC_JSON}" | jq -r '.securityGroups | join(",")')
          ASSIGN_PUBLIC=$(echo "${NC_JSON}" | jq -r '.assignPublicIp // "DISABLED"')
          NETWORK_CONFIGURATION="awsvpcConfiguration={subnets=[${SUBNETS}],securityGroups=[${SGS}],assignPublicIp=${ASSIGN_PUBLIC}}"

          CP_STRATEGY=$(echo "${SERVICE_JSON}" | jq -c '.services[0].capacityProviderStrategy // []')
          RUN_TASK_ARGS=( )
          if [[ "$(echo "${CP_STRATEGY}" | jq 'length')" -gt 0 ]]; then
            while IFS= read -r line; do
              [[ -z "${line}" ]] && continue
              RUN_TASK_ARGS+=( --capacity-provider-strategy "$line" )
            done < <(echo "${CP_STRATEGY}" | jq -r '.[] | "capacityProvider=\(.capacityProvider),weight=\(.weight)" + (if .base != null then ",base=\(.base)" else "" end)')
          else
            LT=$(echo "${SERVICE_JSON}" | jq -r '.services[0].launchType // "FARGATE"')
            RUN_TASK_ARGS+=( --launch-type "${LT}" )
          fi

          echo "::group::ECS run-task (migración)"
          RUN_JSON=$(aws ecs run-task \
            --cluster "${ECS_CLUSTER}" \
            --task-definition "${NEW_TASK_DEF_ARN}" \
            "${RUN_TASK_ARGS[@]}" \
            --region "${AWS_REGION}" \
            --network-configuration "${NETWORK_CONFIGURATION}" \
            --overrides "${OVERRIDES_JSON}" \
            --started-by "github-actions-${GH_RUN_ID}" \
            --no-cli-pager \
            --output json)

          TASK_ARN=$(echo "${RUN_JSON}" | jq -r '.tasks[0].taskArn // empty')
          if [[ -z "${TASK_ARN}" ]]; then
            echo "Respuesta run-task:"
            echo "${RUN_JSON}" | jq .
            echo "::endgroup::"
            echo "::error::run-task no colocó la tarea (revisa failures, IAM PassRole y permisos ecs:RunTask)."
            exit 1
          fi

          echo "Task ARN (enmascarado en logs de CloudWatch si aplica): ${TASK_ARN}"
          echo "::endgroup::"

          echo "Esperando tasks-stopped..."
          aws ecs wait tasks-stopped --cluster "${ECS_CLUSTER}" --tasks "${TASK_ARN}" --region "${AWS_REGION}"

          DESCRIBE_JSON=$(aws ecs describe-tasks \
            --cluster "${ECS_CLUSTER}" \
            --tasks "${TASK_ARN}" \
            --region "${AWS_REGION}" \
            --output json)

          STOP_CODE=$(echo "${DESCRIBE_JSON}" | jq -r '.tasks[0].stopCode // empty')
          STOP_REASON=$(echo "${DESCRIBE_JSON}" | jq -r '.tasks[0].stoppedReason // empty')
          EXIT_CODE=$(echo "${DESCRIBE_JSON}" | jq -r --arg cname "${ECS_CONTAINER_NAME}" \
            '[.tasks[0].containers[] | select(.name == $cname) | .exitCode] | first // empty')

          if [[ -z "${EXIT_CODE}" || "${EXIT_CODE}" == "null" ]]; then
            echo "::group::describe-tasks (no container exitCode — task may have failed before start)"
            echo "${DESCRIBE_JSON}" | jq '.tasks[0] | {stopCode, stoppedReason, containers}'
            echo "::endgroup::"
            if [[ "${STOP_REASON}" == *"did not contain json key"* ]]; then
              echo "::error::ECS task definition references a JSON key in Secrets Manager that is missing from the secret. Edit the task definition: each secret \"key\" must match a property in the secret JSON (e.g. DB_HOST, DB_PASSWORD). Placeholder names like KEY will fail."
            elif [[ "${STOP_CODE}" == "TaskFailedToStart" ]]; then
              echo "::error::TaskFailedToStart: ${STOP_REASON}"
            else
              echo "::error::No exitCode for container ${ECS_CONTAINER_NAME}. stopCode=${STOP_CODE}"
            fi
            exit 1
          fi

          if [[ "${EXIT_CODE}" != "0" ]]; then
            echo "::group::Migration task failed (non-zero exit)"
            echo "${DESCRIBE_JSON}" | jq '.tasks[0] | {stoppedReason: .stoppedReason, stopCode: .stopCode, containers: .containers}'
            echo "::endgroup::"
            echo "::error::Migration exited with code ${EXIT_CODE}"
            exit 1
          fi

          echo "migration_ok=true" >> "$GITHUB_OUTPUT"
          echo "Migración ECS completada (exit 0)."

      - name: Update ECS service
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --task-definition "${{ steps.register-task-def.outputs.task_def_arn }}" \
            --force-new-deployment \
            --region "${AWS_REGION}" \
            --no-cli-pager

      - name: Deployment summary
        run: |
          set -euo pipefail
          {
            echo "## Despliegue Develop — ECR & ECS"
            echo ""
            echo "| Campo | Valor |"
            echo "|--------|--------|"
            echo "| Rama / ref | \`${GITHUB_REF_NAME}\` |"
            echo "| Commit (corto) | \`${{ steps.vars.outputs.short_sha }}\` |"
            echo "| Tag rama | \`${{ steps.vars.outputs.branch_name }}\` |"
            echo "| Imagen (commit) | \`${{ steps.image-meta.outputs.image_uri }}\` |"
            echo "| Cluster | \`${ECS_CLUSTER}\` |"
            echo "| Servicio | \`${ECS_SERVICE}\` |"
            echo "| Contenedor actualizado | \`${ECS_CONTAINER_NAME}\` |"
            echo "| Puerto contenedor (ALB/TG) | \`${ECS_CONTAINER_PORT}\` |"
            echo "| Task definition | \`${{ steps.register-task-def.outputs.task_def_arn }}\` |"
            echo "| Región | \`${AWS_REGION}\` |"
            echo "| Cuenta | \`${AWS_ACCOUNT_ID}\` |"
            echo "| Repositorio ECR | \`${ECR_REPOSITORY_NAME}\` |"
            echo "| Migración ECS (run-task) | \`${{ steps.ecs-migrate.outputs.migration_ok }}\` |"
            echo ""
            echo "### OIDC"
            echo "Rol asumido: \`${AWS_ROLE_TO_ASSUME}\`"
            echo ""
            echo "### Notas"
            echo "- Imagen etiquetada: \`${{ steps.vars.outputs.short_sha }}\`, \`${{ steps.vars.outputs.branch_name }}\`, \`latest\`."
            echo "- Tras registrar la task definition: **ECS run-task** ejecuta \`node dist/scripts/run-migrations.js\` en la VPC; si falla, no se llama a \`update-service\`."
            echo "- Se registró una **nueva revisión** de task definition (imagen + \`portMappings\` + \`PORT\`) y se aplicó \`force-new-deployment\`."
            echo "- Target group del ALB: path de health \`/api/health\`, puerto = \`${ECS_CONTAINER_PORT}\`."
          } >> "$GITHUB_STEP_SUMMARY"
